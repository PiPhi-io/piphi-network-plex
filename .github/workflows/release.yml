name: Publish Plex release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag matching manifest.version (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: plex-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Check release inputs and OIDC configuration
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release_ref must be an existing version tag such as v0.1.0"
            exit 1
          fi
          if [[ -z "$DOCKERHUB_OIDC_CONNECTIONID" ]]; then
            echo "::error::Make DOCKERHUB_OIDC_CONNECTIONID available through organization, repository, or release environment variables"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.release_ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install '.[dev]'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Require committed release assets
        run: git diff --exit-code -- manifest.json widgets
      - run: npm run validate:widgets
      - run: npm test
      - name: Test installed runtime with release widget assets
        env:
          PIPHI_WIDGETS_PATH: ${{ github.workspace }}/widgets
        run: python -m pytest -q
      - run: python scripts/validate.py
      - name: Verify tagged release and catalog consistency
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: python scripts/check_release.py "$RELEASE_REF"
      - name: Read validated image name
        id: release
        run: python -c 'import json,os; m=json.load(open("manifest.json")); print("image=" + m["image"], file=open(os.environ["GITHUB_OUTPUT"], "a"))'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to Docker Hub with OIDC
        uses: docker/login-action@v4.5.0
        with:
          username: piphinetwork
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
      - name: Publish runtime including widget bundles
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.release.outputs.image }}
      - name: Package release assets
        run: tar -czf plex-widgets.tar.gz widgets
      - name: Create reviewable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.release_ref }}
          IMAGE: ${{ steps.release.outputs.image }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: >-
          gh release create "$RELEASE_REF" manifest.json registry/plex.json plex-widgets.tar.gz
          --verify-tag --prerelease --title "Plex $RELEASE_REF"
          --notes "Runtime: $IMAGE at $IMAGE_DIGEST. Registry status remains draft; runtime qualification remains unverified."
